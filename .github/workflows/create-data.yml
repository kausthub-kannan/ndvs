name: Create data

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # needed to commit regenerated CSVs back

concurrency:
  group: create-data-${{ github.ref }}
  cancel-in-progress: false # never cancel: CSVs must stay in sync with markdowns

jobs:
  convert:
    name: Markdown → CSV
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout (full ref so we can push regenerated CSVs back) ──────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # ── 2. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install converter dependency (PyYAML; script falls back ───────
      #      to a tiny parser without it, but PyYAML keeps scalars exact)
      - name: Install converter dependencies
        run: pip install --upgrade pip pyyaml

      # ── 4. Run the converter FIRST, before anything else consumes data/ ──
      - name: Regenerate CSVs from markdowns
        run: python data/convert.py

      # ── 5a. On PRs: fail if the contributor forgot to regenerate CSVs ────
      - name: Check CSVs are up to date (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- data/*.csv || {
            echo "::error::data/*.csv is out of date. Run 'python data/convert.py' locally and commit the result."
            exit 1
          }

      # ── 5b. On push to main (incl. PR merges): commit CSVs back ───────────
      - name: Commit regenerated CSVs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || git commit -m "chore(data): regenerate CSVs from markdowns [skip ci]"
          git push
