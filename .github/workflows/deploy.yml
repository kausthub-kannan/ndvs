name: Build & Deploy to GitHub Pages

# Runs ONLY after the "Create Data" workflow completes successfully.
# Do NOT add a push/pull_request trigger here: ordering (Create Data first,
# Deploy second) is guaranteed by this `workflow_run` chain. To cut a
# release, just push a version tag (e.g. `git push origin v0.6.1`).
on:
  workflow_run:
    workflows: ["Create Data"]
    types:
      - completed

permissions:
  contents: write # needed to publish to the gh-pages branch
  actions: read  # needed to download the site artifact from the Create Data run

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false # deployments must not interleave on gh-pages

jobs:
  deploy:
    name: Publish Site → gh-pages
    runs-on: ubuntu-latest
    # Only deploy validated release builds; skip hand-cancelled/failed ones.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # ── 1. Fetch the validated site built by the Create Data run ─────────
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # ── 2. Publish to GitHub Pages (gh-pages branch) ─────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          commit_message: "deploy: release ${{ github.event.workflow_run.head_branch }}"
