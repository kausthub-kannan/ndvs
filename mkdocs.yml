site_name: Nalāyira Divya Prabandham
site_description: >-
  A digital book of the Nalāyira Divya Prabandham — 4000 sacred Tamil verses
  composed by the Āḻvārs, with Tamil scripts, transliteration, meaning, and purport.
site_author: NDVS
site_url: https://kausthub-kannan.github.io/ndvs/

repo_name: kausthub-kannan/ndvs
repo_url: https://github.com/kausthub-kannan/ndvs

docs_dir: docs
site_dir: site

theme:
  name: material
  favicon: assets/favicon.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.collapse
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  font:
    text: Noto Sans
    code: Noto Sans Mono

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - attr_list
  - def_list
  - toc:
      permalink: true

plugins:
  - search:
      lang: en

extra:
  generator: false

